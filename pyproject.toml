[project]
name = "ai_playground"
version = "0.1.0"
description = "A simple terminal-based AI hobby app."
readme = "README.md"
authors = [
    { name = "Abdelaziz Khabthani" }
]
requires-python = ">=3.11"
dependencies = [
    "openai>=2.36,<2.37",
]

[project.scripts]
ai-playground = "ai_playground.main:main"

[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"
